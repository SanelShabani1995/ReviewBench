name: Onboarding approved

# When a manifest pull request is merged, tell the agent's contacts what
# comes next: a test run in the vendor portal, after storing credentials if
# the manifest declares any and they are not stored yet. Mentioning the
# contacts is what makes GitHub send the email.

on:
  pull_request:
    types: [closed]
    paths:
      - "agents/*.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The merged pull request no longer has a merge ref, so check out the
      # commit the merge produced.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Comment with the next step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PORTAL: ${{ vars.VENDOR_PORTAL_URL || 'https://review-bench.ai/submit' }}
        run: |
          set -euo pipefail
          # The manifests this pull request added or changed.
          files=$(gh pr view "$PR" -R "$REPO" --json files --jq '.files[].path | select(startswith("agents/") and endswith(".json"))')
          for f in $files; do
            [ -f "$f" ] || continue
            name=$(jq -r '.name' "$f")
            display=$(jq -r '.display_name' "$f")
            mentions=$(jq -r '[.contacts[]? | "@" + .] | join(" ")' "$f")
            declared=$(jq -r '[(.secrets.env // [])[], (.secrets.files // [])[]] | length' "$f")
            {
              echo "$mentions: **$display** (\`$name\`) is approved."
              echo
              echo "Next step: start a test run in the vendor portal."
              if [ "$declared" -gt 0 ]; then
                echo "If you have not stored the agent's credentials yet, do that first."
              fi
              echo
              echo "$PORTAL"
            } > /tmp/comment.md
            gh pr comment "$PR" -R "$REPO" --body-file /tmp/comment.md
          done
